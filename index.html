<style>
:root{

#bS2{--sz:var(--btn);--bg:#1fae92;right:calc(16px + var(--btn)*.15 + var(--sr));bottom:calc(30px + var(--sb) + var(--btn)*1.3)}
#bS3{--sz:var(--btn);--bg:#e8843a;right:calc(36px + var(--btn)*2.45 + var(--sr));bottom:calc(34px + var(--sb) + var(--btn)*.55)}

    const t=H(cx,cz),c=o.col(cx,cz,t,r());

function zkey(){return(mode==='play'&&C&&zone&&zone.id!=='preview')?(zone.id==='town'?'town:'+zone.cls:zone.id):'';}
function coopTargets(){return coop.tg;}

function loadPeer(ok,bad){

function mkR(slot,conn){return coop.Rs[slot]={slot,conn:conn||null,x:0,z:0,tx:0,tz:0,vx:0,vz:0,tt:0,f:0,tf:0,zk:'',mv:0,k:-1,b:0,bl:0,dg:-1,fa:0,H:null,key:'',tag:null,p:null,first:true,lm:0};}

function coopStop(){

  coop.peer=null;coop.conn=null;
  cs.forEach(c=>{if(c){try{c.send({t:'bye'});}catch(e){}try{c.close();}catch(e){}}});
  if(p){try{p.destroy();}catch(e){}}

function coopFail(msg){coopStop();coop.st='err';coop.err=msg;renderCoop();}
function coopHost(tries){
  tries=tries||0;coop.role='host';coop.st='wait';coop.err='';coop.open=false;coop.me=0;renderCoop();
  loadPeer(()=>{
    const code=Array.from({length:4},()=>CODE_AL[Math.random()*CODE_AL.length|0]).join('');
    let p;try{p=new Peer('ezv-'+code);}catch(e){return coopFail(t('coopNet'));}
    coop.peer=p;coop.code=code;
    p.on('open',()=>{coop.open=true;renderCoop();});
    p.on('connection',c=>{
      c.on('open',()=>{
        const slot=[1,2].find(s=>!coop.Rs[s]);
        if(!slot){rawSend(c,{t:'full'});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
        hostAttach(c,slot);
      });
    });
    p.on('error',e=>{
      if(e&&e.type==='unavailable-id'&&tries<5){try{p.destroy();}catch(_){}coop.peer=null;coopHost(tries+1);return;}
      if(coopOn())return;coopFail(t('coopNet'));
    });

  },()=>coopFail(t('coopNoLib')));

function hostAttach(c,slot){
  const R=mkR(slot,c);coop.st='on';coop.sig='';
  c.on('data',d=>{try{hostMsg(R,d);}catch(e){console.error(e);}});
  c.on('close',()=>hostLost(R));c.on('error',()=>hostLost(R));
  rawSend(c,{t:'you',s:slot});
  const pr=profNow();if(pr)rawSend(c,{t:'hello',s:0,p:pr});
  coopList().forEach(o=>{if(o!==R&&o.p)rawSend(c,{t:'hello',s:o.slot,p:o.p});});
  if(C&&C.qs&&C.qs.length)rawSend(c,{t:'qs',q:C.qs.map(a=>a.i)});
  coopHud();renderCoop();
}
function hostLost(R){
  if(coop.Rs[R.slot]!==R)return;
  const had=R.p;try{R.conn&&R.conn.close();}catch(e){}
  dropR(R);coopList().forEach(o=>rawSend(o.conn,{t:'left',s:R.slot}));
  if(!coopList().length)coop.st='wait';
  if(had&&mode==='play')banner(t('coopFriendOut'));

function hostMsg(R,d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case 'hello':if(setRemote(R,d.p))coopList().forEach(o=>{if(o!==R)rawSend(o.conn,{t:'hello',s:R.slot,p:R.p});});break;
    case 'pos':onPos(R,d);if(R.p){const o2=Object.assign({},d,{s:R.slot});coopList().forEach(o=>{if(o!==R)rawSend(o.conn,o2);});}break;
    case 'need':R.lm=0;break;
    case 'hit':onHit(R,d);break;
    case 'buf':onBuf(d);if(R.p){const o2=Object.assign({},d,{s:R.slot});coopList().forEach(o=>{if(o!==R)rawSend(o.conn,o2);});}break;
    case 'bye':hostLost(R);break;
    case 'qs':if(Array.isArray(d.q)){setSharedQs(d.q);coopList().forEach(o=>{if(o!==R)rawSend(o.conn,{t:'qs',q:d.q});});}break;
  }
}
function coopJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4){coop.err=t('coopNoRoom');renderCoop();return;}
  coop.role='guest';coop.st='joining';coop.code=code;coop.err='';renderCoop();
  loadPeer(()=>{
    let p;try{p=new Peer();}catch(e){return coopFail(t('coopNet'));}
    coop.peer=p;let done=false;
    const to=setTimeout(()=>{if(!done)coopFail(t('coopNoRoom'));},12000);
    p.on('open',()=>{
      const c=p.connect('ezv-'+code,{reliable:true});
      c.on('open',()=>{done=true;clearTimeout(to);guestAttach(c);});
      c.on('error',()=>{});
    });
    p.on('error',e=>{if(done&&coopOn())return;clearTimeout(to);coopFail(e&&e.type==='peer-unavailable'?t('coopNoRoom'):t('coopNet'));});
  },()=>coopFail(t('coopNoLib')));
}
function guestAttach(c){
  coop.conn=c;coop.st='on';coop.sig='';coop.lp=0;dropAll();
  c.on('data',d=>{try{guestMsg(d);}catch(e){console.error(e);}});
  c.on('close',()=>guestLost(c));c.on('error',()=>guestLost(c));
  coopHud();renderCoop();
}
function guestLost(c){
  if(coop.conn!==c)return;
  const had=coopList().some(R=>R.p);const p=coop.peer;coop.peer=null;coop.conn=null;
  if(p){try{p.destroy();}catch(e){}}
  dropAll();coop.role=null;coop.st='idle';coop.code='';coop.tg=[];
  if(had&&mode==='play')banner(t('coopFriendOut'));
  coopHud();renderCoop();
}
function guestMsg(d){
  if(!d||typeof d!=='object')return;
  const sl=clamp((d.s|0),0,2);
  switch(d.t){
    case 'full':coopFail(t('coopFull'));break;
    case 'you':coop.me=clamp(d.s|0,1,2);break;
    case 'hello':if(sl!==coop.me)setRemote(coop.Rs[sl]||mkR(sl,null),d.p);break;
    case 'pos':{const R=coop.Rs[sl];if(R)onPos(R,d);break;}
    case 'left':{const R=coop.Rs[sl];if(R){dropR(R);renderCoop();}break;}
    case 'qs':setSharedQs(d.q);break;
    case 'mons':onMons(d);break;
    case 'kill':onKill(d);break;
    case 'buf':if(sl!==coop.me)onBuf(d);break;
    case 'hurt':if(zone&&zone.sync&&!paused&&!trans&&S.state==='play'&&mode==='play')hurt(clamp((+d.a)||1,1,999),clamp((+d.l)||0,0,30));break;
    case 'bye':guestLost(coop.conn);break;
  }
}
function cleanProf(p){
  if(!p||['warrior','mage','ranger'].indexOf(p.c)<0)return null;
  const L=p.l||{},E2=p.e||{},ci=(v,n)=>clamp((+v)|0,0,n-1);
  return {n:String(p.n||'Hero').slice(0,12),c:p.c,l:{hair:ci(L.hair,HAIR.length),skin:ci(L.skin,SKIN.length),outfit:ci(L.outfit,OUTF.length),hat:0,g:ci(L.g,2),hs:ci(L.hs,12)},e:{w:ci(E2.w,10),a:ci(E2.a,4),p:ci(E2.p,2),h:ci(E2.h,21)},v:ci(p.v,E.MAXLV+1)||1};
}
function setRemote(R,p){
  p=cleanProf(p);if(!p)return false;
  const key=JSON.stringify([p.c,p.l,p.e]);
  if(key!==R.key){R.key=key;if(R.H){scene.remove(R.H.root);disposeGroup(R.H.root);}R.H=buildHero(p.c,Object.assign({},p.l,{ew:p.e.w,ea:p.e.a,ep:p.e.p,eh:p.e.h}));scene.add(R.H.root);R.H.root.visible=false;}
  const fresh=!R.p;R.p=p;if(R.tag){R.tag.remove();R.tag=null;}
  if(fresh&&mode==='play')banner(t('coopFriendIn',p.n));
  renderCoop();return true;
}
function onPos(R,d){
  const f=v=>Number.isFinite(+v)?+v:0,now=performance.now();
  const nx=clamp(f(d.x),-45,45),nz=clamp(f(d.z),-45,45),zk=typeof d.zk==='string'?d.zk.slice(0,16):'';
  if(R.tt&&zk===R.zk&&!R.first){const dt=Math.max(.02,(now-R.tt)/1000);R.vx=clamp((nx-R.tx)/dt,-14,14);R.vz=clamp((nz-R.tz)/dt,-14,14);}else{R.vx=R.vz=0;}
  R.tt=now;R.tx=nx;R.tz=nz;R.tf=f(d.f);R.mv=d.m?1:0;R.k=f(d.k);R.b=d.b?1:0;R.bl=d.bl?1:0;R.dg=d.dg===undefined?-1:f(d.dg);R.fa=d.fa?1:0;
  if(zk!==R.zk){R.zk=zk;R.first=true;R.vx=R.vz=0;renderCoop();}
  if(R.first){R.x=R.tx;R.z=R.tz;R.f=R.tf;R.first=false;}
}
const ST=['idle','chase','windup','rest'];
function rmMon(q){zone.group.remove(q.root);disposeGroup(q.root);if(q.tagEl){q.tagEl.remove();q.tagEl=null;}const i=zone.mons.indexOf(q);if(i>=0)zone.mons.splice(i,1);}
function onMons(d){
  if(!zone||!zone.sync||coop.role!=='guest'||d.zk!==coop.myZ||!Array.isArray(d.l))return;
  const seq=++coop.seq,now=performance.now();
  for(const e of d.l){
    if(!Array.isArray(e)||!E.MON[e[1]])continue;const id=e[0]|0,nx=+e[2]||0,nz=+e[3]||0;
    let m=zone.mons.find(q=>q.pup&&q.id===id&&!q.dead);
    if(!m){m=spawnMon(e[1]);m.id=id;m.pup=true;m.x=m.tx=nx;m.z=m.tz=nz;m.vx=m.vz=0;m.tt=now;m.face=m.tf=+e[4]||0;m.root.position.set(m.x,0,m.z);}
    else{const dt=Math.max(.02,(now-m.tt)/1000);m.vx=clamp((nx-m.tx)/dt,-16,16);m.vz=clamp((nz-m.tz)/dt,-16,16);}
    m.tt=now;m.tx=nx;m.tz=nz;m.tf=+e[4]||0;m.hp=+e[5]||1;m.maxHp=+e[6]||m.hp;m.st=e[7]|0;m.w=+e[8]||0;m.seen=seq;
  }
  zone.mons.filter(q=>q.pup&&!q.dead&&q.seen!==seq).forEach(rmMon);
}
function onHit(R,d){
  if(coop.role!=='host'||!zone||!zone.field||!R.p||R.zk!==coop.myZ)return;
  const m=zone.mons.find(q=>q.id===(d.id|0)&&!q.dead);if(!m||m.pup)return;
  hitMon(m,{d:clamp((+d.d)|0,1,999),crit:!!d.c},{dx:+d.dx||0,dz:+d.dz||0,stun:clamp(+d.st||0,0,5),slow:clamp(+d.sl||0,0,8),remote:true});

function onKill(d){

function puppet(m,dt){
  const d=m.d,age=Math.min(.12,(performance.now()-m.tt)/1000);
  const px=m.tx+m.vx*age,pz=m.tz+m.vz*age,f=1-Math.exp(-dt*16);
  m.x+=(px-m.x)*f;m.z+=(pz-m.z)*f;m.face+=angDiff(m.face,m.tf)*f;
  const sp=Math.hypot(m.vx,m.vz);if(sp>.35){m.wx=m.x+m.vx*2;m.wz=m.z+m.vz*2;}else{m.wx=m.x;m.wz=m.z;}
  const ns=ST[m.st]||'idle';
  if(ns==='windup'){m.tele.visible=true;m.wind=m.w;m.disc.scale.setScalar(Math.max(.05,d.aoe*(1-m.w/d.wind)));}
  else if(m.state==='windup'){m.tele.visible=false;if(ns==='rest'){burst(m.x,.6,m.z,0xff6b4a,8,4,2.5);ringFx(m.x,m.z,d.aoe,0xff5a4a,.35);m.pulse=.3;shake=Math.max(shake,.25);}}
  m.state=ns;
  m.root.position.set(m.x,0,m.z);m.model.rotation.y=m.face;
  animMon(m,dt);m.ring.visible=true;
  if(m.hp<m.maxHp||d.big){m.bar.visible=true;m.bar.quaternion.copy(camera.quaternion);m.fg.scale.x=1.3*Math.max(0,m.hp/m.maxHp);}
}
function clearMons(){zone.mons.slice().forEach(rmMon);zone.spawnQ.length=0;}
function coopWorld(dt){
  if(!zone.sync)for(let i=zone.spawnQ.length-1;i>=0;i--){const q=zone.spawnQ[i];q.t-=dt;if(q.t<=0){zone.spawnQ.splice(i,1);if(phaseTypes(zone.id).indexOf(q.type)>=0)spawnMon(q.type);}}
  zone.mons.slice().forEach(m=>updMon(m,dt));

function profNow(){return C?{n:C.name,c:C.cls,l:C.look,e:{w:C.eq.w,a:C.eq.a,p:C.eq.p,h:C.eq.h|0},v:level()}:null;}
function coopTick(dt){
  try{
    coop.myZ=zkey();
    if(!coopOn()){
      coop.tg=[];
      if(zone&&zone.sync){zone.sync=false;if(zone.field){clearMons();populate(zone.id);}}
      return;
    }
    const now=performance.now(),list=coopList();
    if(now-coop.lp>=TICK){
      coop.lp=now;
      const pr=profNow(),sg=pr?JSON.stringify(pr):'';
      if(pr&&sg!==coop.sig){coop.sig=sg;coopSend({t:'hello',s:coop.me,p:pr});}
      const on=!!coop.myZ;
      coopSend({t:'pos',s:coop.me,zk:coop.myZ,x:on?+S.x.toFixed(2):0,z:on?+S.z.toFixed(2):0,f:+S.face.toFixed(2),m:S.moving&&S.dodgeT<=0?1:0,k:S.swing>0?+(1-S.swing/S.swingMax).toFixed(2):-1,b:S.big?1:0,bl:S.blocking?1:0,dg:S.dodgeT>0?+(1-S.dodgeT/.35).toFixed(2):-1,fa:S.state==='faint'?1:0});
    }
    // host -> each guest in my zone: monster snapshot
    if(coop.role==='host'&&coop.myZ&&zone.field){
      let snap=null;
      for(const R of list){
        if(!R.p||R.zk!==coop.myZ||now-R.lm<TICK)continue;
        R.lm=now;
        if(!snap)snap={t:'mons',zk:coop.myZ,l:zone.mons.filter(m=>!m.dead).map(m=>[m.id,m.type,+m.x.toFixed(2),+m.z.toFixed(2),+m.face.toFixed(2),m.hp,m.maxHp,m.state==='chase'?1:m.state==='windup'?2:m.state==='rest'?3:0,+(m.wind||0).toFixed(2)])};
        rawSend(R.conn,snap);
      }
    }
    // host: who can monsters target?
    coop.tg=coop.role==='host'?list.filter(R=>R.p&&!R.fa&&R.zk&&R.zk===coop.myZ):[];
    // guest: sync with the host's monsters when in the same field
    if(zone){
      const RH=coop.Rs[0],want=coop.role==='guest'&&!!zone.field&&!!RH&&!!RH.zk&&RH.zk===coop.myZ;
      if(want&&!zone.sync){zone.sync=true;clearMons();coopSend({t:'need'});}
      else if(!want&&zone.sync){zone.sync=false;clearMons();if(zone.field)populate(zone.id);}
    }
    // friends' heroes
    for(const R of list){
      if(!R.H||!R.p)continue;
      const vis=!!(zone&&R.zk&&R.zk===coop.myZ);R.H.root.visible=vis;
      if(!vis)continue;
      const age=Math.min(.12,(now-R.tt)/1000),px=R.tx+R.vx*age,pz=R.tz+R.vz*age,f=1-Math.exp(-dt*16);
      if(Math.hypot(R.tx-R.x,R.tz-R.z)>8){R.x=R.tx;R.z=R.tz;}else{R.x+=(px-R.x)*f;R.z+=(pz-R.z)*f;}
      R.f+=angDiff(R.f,R.tf)*f;
      const H2=R.H;H2.root.position.set(R.x,0,R.z);H2.root.rotation.y=R.f;
      animHero(H2,{moving:!!R.mv&&R.dg<0,spd:E.moveSpeed(R.p.c,Math.max(1,R.p.v))*1.35,atk:R.k,big:!!R.b,dodge:R.dg,block:!!R.bl,hurt:0,faint:!!R.fa,cheer:0},dt,T);
      H2.pivot.rotation.x=R.fa?lerp(H2.pivot.rotation.x,-1.45,1-Math.exp(-dt*8)):R.dg>=0?-R.dg*Math.PI*2:0;
    }
  }catch(e){console.error('coopTick',e);}
}

    else{const k=readInput();let sp=E.moveSpeed(C.cls,L)*1.35*(S.hasteT>0?1.35:1);if(S.blocking)sp*=.5;if(S.swing>0)sp*=.6;vx=k.x*sp;vz=k.z*sp;
      if(k.m>.05&&S.swing<=0)S.face+=angDiff(S.face,Math.atan2(k.x,k.z))*(1-Math.exp(-dt*18));}

function setSharedQs(list){if(!Array.isArray(list)||!C)return;const old=C.qs;C.qs=[];list.slice(0,3).forEach(i=>{i=i|0;if(i<0||i>=E.QUESTS.length||C.qx.indexOf(i)>=0||C.qs.some(a=>a.i===i))return;const o=old.find(a=>a.i===i);C.qs.push({i,p:o?o.p:0});});saveDB();if($('#mis').classList.contains('show'))renderMissions();}

function renderMissions(){
  const box=$('#misBody');box.innerHTML='';const town=!!zone&&zone.id==='town';
  const n=new Date(),ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n,hh=Math.floor(ms/3600000),mm=Math.floor(ms%3600000/60000);
  const info=document.createElement('div');info.className='note';info.style.cssText='margin:0 0 8px;font-weight:800;opacity:1';
  info.innerHTML='<b>'+t('misSlots',C.qs.length)+'</b> · '+t('misReset',hh,mm)+(coopOn()?'<br>'+t('qShared'):'')+(town?'':'<br><span style="color:#c4243c">'+t('misTown')+'</span>');box.appendChild(info);
  const st=i=>C.qs.some(a=>a.i===i)?0:C.qx.indexOf(i)>=0?2:1;
  E.QUESTS.map((q,i)=>i).sort((x,y)=>st(x)-st(y)||x-y).forEach(i=>{
    const q=E.QUESTS[i],m=E.MON[q.t],a=C.qs.find(x=>x.i===i),done=C.qx.indexOf(i)>=0,ph=monPhase(q.t);
    const el=document.createElement('div');el.className='misRow'+(a?' act':'')+(done?' done':'');if(done)el.style.opacity='.55';
    el.innerHTML='<div class="si">'+m.icon+'</div><div class="st"><b>'+t('defeat',q.n,mn(q.t))+(ph==='d'?' <small>'+t('phD')+'</small>':ph==='n'?' <small>'+t('phN')+'</small>':'')+'</b><small>'+t('recLv')+' '+m.lvl+' · '+t('z_'+(m.at||'meadow'))+' · '+t('reward')+' '+ic('coin',14)+qReward(i).coins+' + ⭐ '+t('bonus')+(C.qd[i]?' · '+t('doneN',C.qd[i]):'')+'</small>'+(a?'<div class="prog">'+Math.min(a.p,q.n)+'/'+q.n+'</div>':'')+'</div>';
    const b=document.createElement('button');b.className='pill'+(a||done?'':' go');
    if(a){b.textContent=town?t('qCancel'):t('active');b.disabled=!town;}
    else if(done){b.textContent=t('qDone');b.disabled=true;}
    else{b.textContent=C.qs.length>=3?t('qFull'):t('take');b.disabled=!town||C.qs.length>=3;}
    b.addEventListener('click',()=>{if(!town)return;SFX.click();if(a){C.qs.splice(C.qs.indexOf(a),1);}else{if(C.qs.length>=3||done)return;C.qs.push({i,p:0});}saveDB();shareQs();renderMissions();});
    el.appendChild(b);box.appendChild(el);});
}

function hotkeys(k,e){

  if(mapOpen){if(k==='m'||k==='escape')closeMap();return true;}
  if(profOpen){if(k==='p'||k==='escape')closeProf();return true;}
  if($('#mis').classList.contains('show')){if(k==='q'||k==='escape')$('#misClose').click();return true;}
  if($('#shop').classList.contains('show')){if(k==='escape')$('#shopClose').click();return true;}
  if($('#coop').classList.contains('show')){if(k==='escape')closeCoop();return true;}
  if($('#pause').classList.contains('show')){if(k==='escape')closePause();return true;}

  return false;
}
