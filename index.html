<style>

}

/* o:{inner,ext,seed,h(x,z) on 2-grid centers,col(cx,cz,t,u),side(t,u),pix(cx,cz,t)} */
function voxTerrain(b,o){
  const bc=v=>Math.floor(v/2)*2+1,H=(x,z)=>o.h(bc(x),bc(z)),r=seeded(o.seed||5);
  b.at(0,0,0,0);
  const nb=[[1,0,1],[-1,0,2],[0,1,16],[0,-1,32]];
  const tile=(cx,cz,s)=>{
    const t=H(cx,cz),c=o.col(cx,cz,t,r());
    b.box(cx,t-.01,cz,s,.02,s,c,0,4);
    if(s===1&&o.pix&&o.pix(cx,cz,t)){for(let k=0;k<2;k++){const px=cx+(r()<.5?-.25:.25),pz=cz+(r()<.5?-.25:.25);b.box(px,t,pz,.5,.02,.5,jit(c,.13,r()),0,4);}}
    for(const n of nb){const tn=H(cx+n[0]*s,cz+n[1]*s);if(tn<t-.001)b.box(cx,(t+tn)/2,cz,s,t-tn,s,o.side(t,r()),0,n[2]);}
  };
  for(let x=-o.inner;x<o.inner;x++)for(let z=-o.inner;z<o.inner;z++)tile(x+.5,z+.5,1);
  for(let x=-o.ext;x<o.ext;x+=2)for(let z=-o.ext;z<o.ext;z+=2){const cx=x+1,cz=z+1;if(Math.abs(cx)<o.inner&&Math.abs(cz)<o.inner)continue;tile(cx,cz,2);}
}

function renderCoop(){
  const box=$('#coopBody');if(!box)return;
  const keepVal=box.querySelector('#cjCode')?box.querySelector('#cjCode').value:'';
  box.innerHTML='';
  const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;box.appendChild(e);return e;};
  const row=()=>{const r=el('div','rowx');r.style.marginTop='12px';return r;};
  const pill=(r,cls,txt,fn,id)=>{const b=document.createElement('button');b.className='pill '+cls;b.textContent=txt;if(id)b.id=id;b.addEventListener('click',()=>{ac();SFX.click();fn();});r.appendChild(b);return b;};
  const st=coop.st;
  if(st==='err'){el('p','note cpErr',esc(coop.err));pill(row(),'go',t('coopOk'),()=>{coop.st='idle';coop.err='';renderCoop();});return;}
  if(st==='idle'){
    el('p','note',t('coopIntro'));
    pill(row(),'go',t('coopCreate'),coopHost,'cCreate');
    el('h3','',t('coopJoin'));
    const r2=el('div','rowx');const inp=document.createElement('input');inp.id='cjCode';inp.maxLength=4;inp.autocapitalize='characters';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='ABCD';inp.value=keepVal;inp.className='codeIn';
    inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')jb.click();});
    const jb=pill(r2,'',t('coopGo'),()=>coopJoin(inp.value),'cJoin');r2.insertBefore(inp,jb);
    if(coop.err)el('p','note cpErr',esc(coop.err));
    return;
  }
  if(st==='recon'){el('p','note',t('coopRecon'));pill(row(),'warn',t('coopLeave'),coopStop);return;}
  if(st==='wait'){
    el('p','note',t('coopHostWait'));
    el('div','codeBig',coop.open?esc(coop.code):'…').id='cCode';
    pill(row(),'warn',t('coopCloseRoom'),coopStop);
    return;
  }
  if(st==='joining'){el('p','note',t('coopJoining'));pill(row(),'',t('coopCancel'),coopStop);return;}
  // connected
  el('div','codeBig sm','✓ '+t('coopConnected')+' · '+t('coopSlots',coopList().filter(R=>R.p).length+1,MAXP));
  if(coop.role==='host'&&coop.open&&coopList().length<MAXP-1)el('p','note',t('coopInvite',esc(coop.code)));
  coopList().sort((a,b)=>a.slot-b.slot).forEach(R=>{
    const p=R.p;if(!p)return;
    el('div','frCard','<b>'+esc(p.n)+'</b><small>'+cn(p.c)+' · Lv '+p.v+'</small><small>'+t('coopWhere')+': '+esc(zoneLabel(R.zk))+'</small>');
    if(R.zk&&R.zk!==coop.myZ){const r=row();r.style.marginTop='0';pill(r,'go',t('coopGoto')+' · '+p.n,()=>coopGoto(R),'cGoto'+R.slot);}
  });
  if(coopList().some(R=>R.p&&R.zk&&R.zk===coop.myZ))el('p','note',t('coopSame'));
  pill(row(),'warn',t('coopLeave'),coopStop);
}

/* day / night: shared wall clock, so every player is always in the same phase */
/* game clock: 1 game hour = 50 s, 06:00-18:00 is day, 18:00-06:00 is night (one full day = 20 min) */
const DAY_S=600,NIGHT_S=600,DUSK=60;
const TOD={night:false,dark:0,left:0,h:6};
function todCompute(){
  const cyc=DAY_S+NIGHT_S,t0=(Date.now()/1000)%cyc,night=t0>=DAY_S,left=night?cyc-t0:DAY_S-t0;
  let d;if(!night)d=left<DUSK?1-left/DUSK:0;else d=left<DUSK?left/DUSK:1;
  TOD.night=night;TOD.left=left;TOD.dark=d*d*(3-2*d);TOD.h=(6+t0/cyc*24)%24;
}
todCompute();
/* weather: also a shared wall clock (same for every player). 4 modes = day/night x clear/rain */
const WX={rain:false,k:0,force:null,prev:null,thT:12};
const WX_SLOT=150;
function wxHash(n){n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return (n>>>0)/4294967296;}
function wxCompute(){WX.rain=WX.force!==null?WX.force:wxHash(Math.floor(Date.now()/1000/WX_SLOT))<.4;}
wxCompute();WX.k=WX.rain?1:0;

function phaseTypes(id){const s=phaseList(id).map(q=>q[0]);bossList(id).forEach(b=>s.push(b[0]));return s;}

const RAIN_BG=new THREE.Color('#76879b'),RAIN_TINT=new THREE.Color('#9aa8b8');
let darkNow=-1,rainNow=-1,prevNight=null;
function applyDark(force){
  const d=(mode==='play'&&zone&&zone.id!=='preview')?TOD.dark:0;
  const r=(mode==='play'&&zone&&zone.id!=='preview')?WX.k:0;
  if(!force&&Math.abs(d-darkNow)<.004&&Math.abs(r-rainNow)<.01)return;darkNow=d;rainNow=r;

    else if(sk.kind==='proj'){const n=sk.count,sp=sk.spread||0,vol=sk.volley||1;
      const shot=()=>{if(!zone||S.state!=='play')return;for(let k=0;k<n;k++){const off=n>1?(k-(n-1)/2)*sp:0;fire(S.face+off+(vol>1?rnd(-.06,.06):0),sk.mult,{color:sk.color,big:sk.big,arrow:cls==='ranger'||(sk.id==='dose'&&cls==='doctor'),range:E.CLASSES[cls].range,speed:sk.speed||(cls==='ranger'?19:14),target:(k===(n-1)/2||n===1)&&tg&&!tg.dead?tg:null});}};

function skillById(id){for(const k in E.SKILLS){const a=E.SKILLS[k].find(q=>q.id===id);if(a)return a;}for(const k in E.ADV){const a=E.ADV[k].skills.find(q=>q.id===id);if(a)return a;}return null;}

function onSv(R,d){
  try{
    if(!R||!R.H||!R.p||!d||d.zk!==coop.myZ||!zone||mode!=='play'||R.zk!==coop.myZ)return;

    else if(sk.kind==='aoe'){const waves=sk.waves||1,delay=sk.delay||0;for(let w=0;w<waves;w++)after(delay+w*.28,()=>{if(!zone)return;ringFx(cx,cz,sk.radius,col,.45);burst(cx,.6,cz,col,14,sk.radius*1.1,4,1.2);});}

function updatePlay(dt){
  const L=level(),c=E.CLASSES[C.cls];

  if(S.state==='faint'){S.faintT-=dt;if(S.faintT<=0)respawn();}
  if(S.state==='play'&&!trans){
    if(S.rest){const kk=readInput();if(kk.m>.1||S.hurtT>0)S.rest=false;else{S.hp=Math.min(S.maxHp,S.hp+S.maxHp*.07*dt);S.restT=(S.restT||0)+dt;if(S.restT>1.1){S.restT=0;float('💤',S.x,2.8,S.z,'heal');}if(S.hp>=S.maxHp){S.rest=false;banner(t('restDone'));}}}
    S.dtl=dt;tutTick();
    S.sinceHurt=(S.sinceHurt||0)+dt;{const rg=petFx().rg;if(rg>0&&!S.rest&&S.hp>0&&S.hp<S.maxHp)S.hp=Math.min(S.maxHp,S.hp+S.maxHp*rg*dt);}if(!S.rest&&S.hp>0&&S.hp<S.maxHp&&S.sinceHurt>5)S.hp=Math.min(S.maxHp,S.hp+S.maxHp*.004*dt);
    S.blockT=Math.max(0,S.blockT-dt);S.blocking=(C.cls==='warrior'||C.cls==='wood')&&(S.defDown||S.blockT>0);
    let vx=0,vz=0;

    else{const k=readInput();let sp=E.moveSpeed(C.cls,L)*1.35*(S.hasteT>0?1.35:1)*(1+petFx().spd);if(S.blocking)sp*=.5;if(S.swing>0)sp*=.6;vx=k.x*sp;vz=k.z*sp;
      if(k.m>.05&&S.swing<=0)S.face+=angDiff(S.face,Math.atan2(k.x,k.z))*(1-Math.exp(-dt*18));}
    if(S.rest){vx=0;vz=0;}
    if(S.lunge>0){S.lunge-=dt;vx+=Math.sin(S.face)*8;vz+=Math.cos(S.face)*8;}
    S.x+=vx*dt;S.z+=vz*dt;S.moving=Math.hypot(vx,vz)>.4;S.moveT+=dt*(S.moving?1:0);

    if(zone.portals){let nr=false;for(const PP of zone.portals){const d=Math.hypot(S.x-PP.x,S.z-PP.z);if(d<PP.r){nr=true;if(S.portalLock<=0){usePortal(PP);break;}}else if(d<PP.r+1.2)nr=true;}if(!nr&&S.portalLock>0&&S.portalLock<1.1)S.portalLock=0;}
  }
  if(zone.id==='town'&&C.tut>=7&&!CINE.on&&!trans&&!((C.cs|0)&CSB[zone.cls]))startCine();
  examTick(dt);
  // spawner
  if(!zone.sync)for(let i=zone.spawnQ.length-1;i>=0;i--){const q=zone.spawnQ[i];q.t-=dt;if(q.t<=0){zone.spawnQ.splice(i,1);if(phaseTypes(zone.id).indexOf(q.type)>=0)spawnMon(q.type);}}
  zone.mons.slice().forEach(m=>updMon(m,dt));
  // hero visuals
  H.root.position.set(S.x,0,S.z);H.root.rotation.y=S.face;
  const sp=S.swing>0?1-S.swing/S.swingMax:-1;
  animHero(H,{moving:S.moving&&S.dodgeT<=0,spd:E.moveSpeed(C.cls,L)*1.35*(S.blocking?.5:1),atk:sp,big:S.big,dodge:S.dodgeT>0?1-S.dodgeT/.35:-1,block:S.blocking,hurt:S.hurtT>0?S.hurtT/.5:0,faint:S.state==='faint',cheer:S.cheer>0?1-S.cheer/S.cheerMax:0},dt,T);

  battle=zone.field&&zone.mons.some(m=>!m.dead&&(m.state==='chase'||m.state==='windup'||m.state==='rest'))?1:0;

/* ---------- Calendar: 4 seasons x 28 days, follows the real date (day 1 of a season is always a Monday) ---------- */
const CAL_EPOCH=new Date(2026,0,5);
const SEASONS=[{id:'bloom',ic:'🌸',col:'#ffc2dc'},{id:'sun',ic:'☀️',col:'#ffe27a'},{id:'harv',ic:'🍂',col:'#ffb26a'},{id:'snow',ic:'❄️',col:'#bfe6ff'}];
/* EVENTS: add your own here. s = season (0 Bloom, 1 Sun, 2 Harvest, 3 Snow), d = day 1..28, id = text key (ev_<id>, evD_<id>) */
const EVENTS=[{s:0,d:14,id:'flower',ic:'🌼'},{s:0,d:28,id:'kite',ic:'🪁'},{s:1,d:7,id:'balloon',ic:'🎈'},{s:1,d:21,id:'lantern',ic:'🏮'},{s:2,d:14,id:'harvest',ic:'🌾'},{s:2,d:28,id:'moon',ic:'🌕'},{s:3,d:7,id:'snowman',ic:'⛄'},{s:3,d:21,id:'star',ic:'🌟'}];
function calNow(){const n=new Date(),d=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-CAL_EPOCH)/864e5),y=Math.floor(d/112),r=((d%112)+112)%112;return{y:y+1,s:Math.floor(r/28),d:r%28+1,abs:d};}
const calAbs=(y,s,d)=>(y-1)*112+s*28+d-1;
const todayEvent=()=>{const n=calNow();return EVENTS.find(e=>e.s===n.s&&e.d===n.d)||null;};
let calS=0,calY=1,calSel=1;
function openCal(){if(mode!=='play'||paused||S.state!=='play')return;const n=calNow();calS=n.s;calY=n.y;calSel=n.d;paused=true;S.defDown=false;S.blocking=false;renderCal();show('cal',true);}
function closeCal(){if(!$('#cal').classList.contains('show'))return;show('cal',false);paused=false;}
function renderCal(){
  const n=calNow(),se=SEASONS[calS],box=$('#calBody');
  let h='<div class="calHead" style="background:'+se.col+'"><button class="mini" id="calPrev" aria-label="prev">◀</button><div>'+se.ic+' '+esc(t('ss_'+se.id))+'<small>'+esc(t('calYear',calY))+' · '+esc(t('calSub'))+'</small></div><button class="mini" id="calNext" aria-label="next">▶</button></div><div class="calG">';
  for(let i=0;i<7;i++)h+='<div class="wd">'+esc(t('wd'+i))+'</div>';
  for(let d=1;d<=28;d++){const ev=EVENTS.find(e=>e.s===calS&&e.d===d),isT=calY===n.y&&calS===n.s&&d===n.d;h+='<button class="cd'+(isT?' today':'')+(d===calSel?' sel':'')+'" data-d="'+d+'">'+d+(ev?'<span class="e">'+ev.ic+'</span>':'')+'</button>';}
  h+='</div>';
  const ev=EVENTS.find(e=>e.s===calS&&e.d===calSel),dw=((calSel-1)%7);
  h+='<div class="calInfo"><b>'+esc(t('wdl'+dw))+', '+calSel+' '+esc(t('ss_'+se.id))+'</b>'+(ev?'<small>'+ev.ic+' <b>'+esc(t('ev_'+ev.id))+'</b> — '+esc(t('evD_'+ev.id))+'</small>':'<small>'+esc(t('calNoEv'))+'</small>')+'</div>';
  const now=n.abs,up=[];for(let y=n.y;y<=n.y+1;y++)EVENTS.forEach(e=>{const a=calAbs(y,e.s,e.d);if(a>=now)up.push({a,e});});up.sort((a,b)=>a.a-b.a);
  h+='<h3>'+esc(t('calUp'))+'</h3><div class="calUp">'+(up.slice(0,3).map(u=>{const dd=u.a-now;return '<div class="calInfo">'+u.e.ic+' <b>'+esc(t('ev_'+u.e.id))+'</b><small>'+esc(t('ss_'+SEASONS[u.e.s].id))+' '+u.e.d+' · '+esc(dd===0?t('calToday'):t('calIn',dd))+'</small></div>';}).join(''))+'</div>';
  box.innerHTML=h;
  box.querySelectorAll('.cd').forEach(b=>b.addEventListener('click',()=>{SFX.click();calSel=+b.dataset.d;renderCal();}));
  $('#calPrev').addEventListener('click',()=>{SFX.click();calS--;if(calS<0){calS=3;calY=Math.max(1,calY-1);}calSel=1;renderCal();});
  $('#calNext').addEventListener('click',()=>{SFX.click();calS++;if(calS>3){calS=0;calY++;}calSel=1;renderCal();});
}

function hotkeys(k,e){
  if($('#talk').classList.contains('show')){if(k==='escape')closeTalk();return true;}
  if($('#kit').classList.contains('show')){if(k==='escape')$('#kitClose').click();return true;}
  if(mapOpen){if(k==='m'||k==='escape')closeMap();return true;}
  if(profOpen){if(k==='p'||k==='escape')closeProf();return true;}
  if($('#mis').classList.contains('show')){if(k==='q'||k==='escape')$('#misClose').click();return true;}
  if($('#shop').classList.contains('show')){if(k==='escape')$('#shopClose').click();return true;}
  if($('#coop').classList.contains('show')){if(k==='escape')closeCoop();return true;}
  if($('#pause').classList.contains('show')){if(k==='escape')closePause();return true;}
  if(paused)return true;
  if(k==='m'){openMap();return true;}if(k==='p'){openProf();return true;}if(k==='q'){openMissions();return true;}if(k==='escape'){openPause();return true;}
  return false;
}
